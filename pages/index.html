<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cloudflare Workers API の動作確認ページ"
    />
    <title>Tips 専科 | API Console</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17221f;
        --muted: #63736e;
        --paper: #f4f1e8;
        --card: #fffdf8;
        --line: #d8ddd5;
        --accent: #e2633a;
        --accent-dark: #b94323;
        --teal: #1c6b67;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 85% 0%, #dbe8d4 0, transparent 32%),
          var(--paper);
        font-family: Georgia, "Yu Mincho", serif;
      }
      .shell {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
      }
      header {
        padding: 30px 0 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .mark {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        color: white;
        background: var(--teal);
        border-radius: 50%;
        font-size: 18px;
      }
      .status {
        color: var(--teal);
        font:
          700 12px/1.2 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        letter-spacing: 0.08em;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
        gap: 24px;
        padding: 56px 0 72px;
      }
      .intro {
        padding: 18px 0;
      }
      .eyebrow {
        margin: 0 0 18px;
        color: var(--accent-dark);
        font:
          700 12px/1.2 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 680px;
        margin: 0;
        font-size: clamp(42px, 7vw, 78px);
        line-height: 0.98;
        font-weight: 500;
        letter-spacing: 0;
      }
      .lead {
        max-width: 570px;
        margin: 26px 0 0;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.8;
      }
      .panel {
        align-self: start;
        padding: 26px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 253, 248, 0.9);
        box-shadow: 0 18px 45px rgba(23, 34, 31, 0.08);
      }
      label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font:
          700 12px/1.2 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      input {
        width: 100%;
        min-height: 46px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--ink);
        background: white;
        font:
          14px ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
      }
      .actions {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-top: 18px;
      }
      button {
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid var(--teal);
        border-radius: 4px;
        color: white;
        background: var(--teal);
        font:
          700 13px ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        cursor: pointer;
      }
      button:hover {
        background: #15534f;
      }
      button.secondary {
        color: var(--teal);
        background: transparent;
      }
      .result {
        min-height: 150px;
        margin: 18px 0 0;
        padding: 14px;
        overflow: auto;
        border-left: 3px solid var(--accent);
        background: #f7f5ee;
        color: #30403b;
        font:
          13px/1.6 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        white-space: pre-wrap;
      }
      .error {
        color: var(--accent-dark);
      }
      .endpoints {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-top: 20px;
      }
      .endpoint {
        padding: 17px;
        border-top: 2px solid var(--teal);
        background: rgba(255, 253, 248, 0.62);
      }
      .endpoint strong {
        display: block;
        margin-bottom: 7px;
        color: var(--teal);
        font:
          700 14px ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
      }
      .endpoint span {
        color: var(--muted);
        font-size: 14px;
      }
      footer {
        padding: 22px 0 30px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
      }
      @media (max-width: 760px) {
        .shell {
          width: min(100% - 28px, 560px);
        }
        header {
          padding-top: 20px;
        }
        main {
          grid-template-columns: 1fr;
          padding-top: 28px;
        }
        h1 {
          font-size: 52px;
        }
        .endpoints {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 420px) {
        .actions {
          grid-template-columns: 1fr;
        }
        .endpoints {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="brand">
          <span class="mark">T</span><span>Tips 専科</span>
        </div>
        <div class="status">CLOUDFLARE / API CONSOLE</div>
      </header>
      <main>
        <section class="intro">
          <p class="eyebrow">IH12A / connected learning</p>
          <h1>知識を、<br />すぐ試せる形に。</h1>
          <p class="lead">
            Cloudflare Workers で公開した API
            に接続し、コース情報や挨拶、運勢、イベントを確認できます。
          </p>
        </section>
        <section class="panel" aria-labelledby="console-title">
          <h2 id="console-title">API Console</h2>
          <label for="base-url">Worker base URL</label>
          <input
            id="base-url"
            type="url"
            value="https://nhih12a20306-inoue-haruki-worker.gakkouyou0225.workers.dev"
            autocomplete="url"
          />
          <div class="actions">
            <button type="button" data-path="/api/course">コースを取得</button>
            <button type="button" data-path="/api/fortune">運勢を取得</button>
            <button type="button" data-path="/api/events">
              イベントを取得
            </button>
            <button type="button" data-path="/api/hello?name=山田">
              挨拶を取得
            </button>
          </div>
          <pre class="result" id="result" aria-live="polite">
ボタンを押すと API のレスポンスを表示します。</pre
          >
        </section>
        <section class="endpoints" aria-label="提供中のエンドポイント">
          <div class="endpoint">
            <strong>GET /api/course</strong><span>講座一覧</span>
          </div>
          <div class="endpoint">
            <strong>GET /api/hello</strong><span>名前付きの挨拶</span>
          </div>
          <div class="endpoint">
            <strong>GET /api/fortune</strong><span>今日の運勢</span>
          </div>
          <div class="endpoint">
            <strong>GET /api/events</strong><span>イベント一覧</span>
          </div>
        </section>
      </main>
      <footer>Pages から Workers API へ接続しています。</footer>
    </div>
    <script>
      const baseUrl = document.querySelector("#base-url");
      const result = document.querySelector("#result");
      document.querySelectorAll("[data-path]").forEach((button) => {
        button.addEventListener("click", async () => {
          const base = baseUrl.value.trim().replace(/\/$/, "");
          result.classList.remove("error");
          result.textContent = "接続中...";
          try {
            const response = await fetch(`${base}${button.dataset.path}`);
            const body = await response.json();
            result.textContent = `${response.status} ${response.statusText}\n\n${JSON.stringify(body, null, 2)}`;
            if (!response.ok) result.classList.add("error");
          } catch (error) {
            result.classList.add("error");
            result.textContent = `接続に失敗しました。Worker URL と CORS 設定を確認してください。\n\n${error.message}`;
          }
        });
      });
    </script>
  </body>
</html>
